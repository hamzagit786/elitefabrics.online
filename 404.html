<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Elite Fabrics – Independent Fabric & Textile Guide</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var path = window.location.pathname.replace(/^\//, '');
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      if (path) {
        window.location.replace('/#' + path + search + hash);
      } else {
        window.location.replace('/' + search + hash);
      }
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; background-color: #FAF8F5; color: #1C1C1C; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
    <div>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 600;">Elite Fabrics</h1>
      <p style="color: #6B655C; font-size: 0.95rem;">Redirecting to the requested page...</p>
      <p><a href="/" style="color: #9E472A; text-decoration: underline; font-weight: 500;">Click here if not redirected</a></p>
    </div>
  </body>
</html>
