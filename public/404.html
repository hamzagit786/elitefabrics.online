<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Elite Fabrics – Fabric &amp; Textile Information</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages
      // Encodes path into query string so index.html restores the clean path without #
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' : '') +
        l.search.slice(1).replace(/&/g, '~and~') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; background-color: #FAF8F5; color: #1C1C1C; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
    <div>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 600;">Elite Fabrics</h1>
      <p style="color: #6B655C; font-size: 0.95rem;">Loading requested page...</p>
    </div>
  </body>
</html>
